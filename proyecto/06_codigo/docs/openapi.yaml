      tags: [purchases]
      operationId: issueOrder
      summary: "Emite la orden (purchases.manage): borrador -> emitida -> 200 | 409 ORDER_NOT_DRAFT."
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200": { description: Orden emitida. }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/purchases/orders/{id}/receptions:
    post:
      tags: [purchases]
      operationId: createReception
      summary: "Recepción contra orden EMITIDA (purchases.manage, RN-07). Body {idempotency_key?, items:[{product_id, numero_lote, fecha_vencimiento, cantidad}]} -> 201 (meta.idempotent_reused=false) | 200 reused=true | 409 ORDER_NOT_ISSUED / EXCEEDS_PENDING / DUPLICATE_LOT. Un producto por item. El stock NO se mueve hasta confirmar."
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                idempotency_key: { type: string, maxLength: 255 }
                items:
                  type: array
                  items:
                    type: object
                    required: [product_id, numero_lote, fecha_vencimiento, cantidad]
                    properties:
                      product_id: { type: integer }
                      numero_lote: { type: string, maxLength: 50 }
                      fecha_vencimiento: { type: string, format: date }
                      cantidad: { type: integer, minimum: 1 }
      responses:
        "201": { description: Recepción registrada. }
        "200": { description: Recepción reutilizada por idempotency_key (RN-09). }
        "400": { $ref: "#/components/responses/ValidationError" }
        "409": { $ref: "#/components/responses/Conflict" }
