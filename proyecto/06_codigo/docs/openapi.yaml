      tags: [purchases]
      operationId: updateOrder
      summary: "Reemplazo completo de items (purchases.manage), SOLO borrador sin recepciones -> 200 | 409 ORDER_NOT_DRAFT."
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [supplier_id, items]
              properties:
                supplier_id: { type: integer }
                items: { type: array, items: { type: object } }
      responses:
        "200": { description: Orden actualizada. }
        "400": { $ref: "#/components/responses/ValidationError" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [purchases]
      operationId: cancelOrder
      summary: "Cancelación lógica (purchases.manage), solo borrador -> 204 | 409 ORDER_NOT_DRAFT / ORDER_NOT_CANCELLABLE / ORDER_HAS_RECEPTIONS."
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "204": { description: Orden cancelada (fila visible). }
        "409": { $ref: "#/components/responses/Conflict" }
