openapi: 3.1.0
info:
  title: API Farmacia
  version: 1.0.0-integracion
  description: |
    Contrato piloto del recurso `catalog_categories` (Workflow 03, CP-API-01).

    Trazabilidad:
    - RF-020 / RN-04: categorías de medicamentos con jerarquía y unicidad.
    - decisiones_api.md: prefix `/api/v1/`, JSON estandarizado, DELETE = inactivación lógica.
    - decisiones_backend.md: multicapa Controller → Validator → Service → Repository (PDO).

    Puntos abiertos (requieren validación humana, no se han inventado valores):
    - **Autenticación/autorización:** RESUELTO en workflow 04 (JWT HS256 Bearer,
      RBAC por permiso; `null`=pública, token=autenticado, `clave`=permiso).
    - **DELETE lógico:** RESUELTO (OPEN-API-01, aprobado 2026-10-04). La migración
      `V1.5.0__catalog_categories_estado.sql` añadió `estado ENUM('activo','inactivo')
      NOT NULL DEFAULT 'activo'` a `catalog_categories`.
servers:
  - url: http://localhost:8000
    description: Entorno local de desarrollo (puerto definitivo a validar en CP-API-02)
tags:
  - name: categories
    description: Categorías de productos (catálogo jerárquico)
paths:
  /api/v1/catalog/categories:
    get:
      tags: [categories]
      operationId: listCategories
      summary: Listar categorías
      parameters:
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: q
          in: query
          required: false
          description: Filtrado por nombre (contiene, case-insensitive).
          schema: { type: string, maxLength: 150 }
        - name: parent_id
          in: query
          required: false
          description: >
            Filtra por categoría padre. Usa `0` para categorías raíz
            (equivalente a `parent_id IS NULL`, misma convención que
            `parent_id_key = IFNULL(parent_id,0)`).
          schema: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Colección de categorías (puede ser vacía).
          content:
            application/json:
              schema:
                type: object
                required: [success, data, meta]
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Category" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "500":
          description: Error de base de datos (mensaje genérico, sin stack trace).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    post:
      tags: [categories]
      operationId: createCategory
      summary: Crear categoría
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CategoryCreate" }
      responses:
        "201":
          description: Categoría creada.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data: { $ref: "#/components/schemas/Category" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          description: |
            Conflicto: nombre duplicado en la misma rama (`nombre`,`parent_id_key`),
            `parent_id` inexistente o ciclo jerárquico.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              example:
                success: false
                error:
                  code: DUPLICATE_NAME
                  message: "Ya existe una categoría con ese nombre en la misma rama."
        "500":
          $ref: "#/components/responses/DatabaseError"
  /api/v1/catalog/categories/{id}:
    parameters:
      - $ref: "#/components/parameters/CategoryId"
    get:
      tags: [categories]
      operationId: getCategory
      summary: Obtener una categoría por ID
      responses:
        "200":
          description: Categoría encontrada.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data: { $ref: "#/components/schemas/Category" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/DatabaseError"
    put:
      tags: [categories]
      operationId: updateCategory
      summary: Actualizar categoría
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CategoryUpdate" }
      responses:
        "200":
          description: Categoría actualizada.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data: { $ref: "#/components/schemas/Category" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Nombre duplicado en la rama, parent_id inexistente o ciclo jerárquico.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "500":
          $ref: "#/components/responses/DatabaseError"
    delete:
      tags: [categories]
      operationId: deleteCategory
      summary: Inactivar categoría (borrado lógico)
      description: |
        Según `decisiones_api.md`, la acción es inactivación lógica
        (`estado='inactivo'`); está prohibido `DELETE FROM`.

        Implementado en CP-API-07 sobre la migración `V1.5.0` (columna `estado`).
        Un registro inactivo queda fuera de la API: `GET`, `PUT`, `DELETE`
        posteriores devuelven 404 y no aparece en el listado. La segunda
        eliminación (ya inactiva) también responde 404. El nombre NO se
        reutiliza en la misma rama: el índice único `(nombre, parent_id_key)`
        cubre también las filas inactivas. En otra rama sí es posible crear
        una categoría con el mismo nombre (la uq es por rama).
      responses:
        "204":
          description: Categoría inactivada.
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/DatabaseError"
  /api/v1/health:
    get:
      tags: [health]
      operationId: health
      summary: Estado del servicio (público). 200 | 503 DATABASE_ERROR si la BD no responde.
      security: []
      responses:
        "200": { description: Servicio operativo. }
        "503": { $ref: "#/components/responses/DatabaseError" }
  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: "Inicio de sesión (público). Body {usuario, password} -> 200 {token, token_type, expires_in, user{id,usuario,roles,permisos}} | 401 INVALID_CREDENTIALS | 403 ACCOUNT_DISABLED | 429 RATE_LIMITED (5 fallos/300s)"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [usuario, password]
              properties:
                usuario: { type: string }
                password: { type: string }
      responses:
        "200": { description: Sesión iniciada con JWT. }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: "Cierra la sesión: revoca el token en token_blacklist -> 200 {revocado:true} | 401 si ya estaba revocado."
      responses:
        "200": { description: Token revocado. }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/auth/me:
    get:
      tags: [auth]
      operationId: me
      summary: "Perfil del token actual -> 200 {id, usuario, roles, permisos}."
      responses:
        "200": { description: Perfil del usuario autenticado. }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/auth/users:
    get:
      tags: [auth]
      operationId: listUsers
      summary: "Listado de usuarios (permiso auth.users.manage) -> 200 [{id, usuario, estado, roles}]."
      responses:
        "200": { description: Colección de usuarios. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [auth]
      operationId: createUser
      summary: "Crea usuario (auth.users.manage). Body {usuario, password>=8, roles:[nombre]} -> 201 | 409 DUPLICATE_NAME."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [usuario, password, roles]
              properties:
                usuario: { type: string, minLength: 3, maxLength: 100 }
                password: { type: string, minLength: 8 }
                roles: { type: array, items: { type: string }, description: "Nombres de rol." }
      responses:
        "201": { description: Usuario creado. }
        "400": { $ref: "#/components/responses/ValidationError" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/auth/users/{id}/roles:
    put:
      tags: [auth]
      operationId: assignUserRoles
      summary: "Reemplaza los roles del usuario (auth.users.manage). Body {roles:[role_id]} -> 200 | 404."
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roles]
              properties:
                roles: { type: array, items: { type: integer }, description: "IDs de rol." }
      responses:
        "200": { description: Roles asignados. }
        "400": { $ref: "#/components/responses/ValidationError" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/auth/roles:
    get:
      tags: [auth]
      operationId: listRoles
      summary: "Listado de roles con permisos (auth.users.manage)."
      responses:
        "200": { description: Colección de roles. }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [auth]
      operationId: createRole
      summary: "Crea rol (auth.users.manage). Body {nombre, descripcion?, permisos:[clave]} -> 201 | 409 DUPLICATE_NAME."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre, permisos]
              properties:
                nombre: { type: string, maxLength: 100 }
                descripcion: { type: string, maxLength: 255 }
                permisos: { type: array, items: { type: string } }
      responses:
        "201": { description: Rol creado. }
        "400": { $ref: "#/components/responses/ValidationError" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/ops/stores:
    get:
      tags: [ops]
      operationId: listStores
      summary: "Sucursales (token). Filtros q/page/limit -> 200 [{id, codigo, nombre, estado}]."
      responses:
        "200": { description: Colección de sucursales. }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [ops]
      operationId: createStore
      summary: "Crea sucursal (ops.config.manage). Body {codigo 1-20 [A-Za-z0-9_-], nombre 1-150} -> 201 | 409 DUPLICATE_CODE."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [codigo, nombre]
              properties:
                codigo: { type: string, maxLength: 20 }
                nombre: { type: string, maxLength: 150 }
      responses:
        "201": { description: Sucursal creada. }
        "400": { $ref: "#/components/responses/ValidationError" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/ops/stores/{id}:
    get:
      tags: [ops]
      operationId: getStore
      summary: "Sucursal por id (token) -> 200 | 404."
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200": { description: Sucursal. }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [ops]
      operationId: updateStore
      summary: "Actualiza sucursal (ops.config.manage) -> 200 | 409 DUPLICATE_CODE."
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [codigo, nombre]
              properties:
                codigo: { type: string, maxLength: 20 }
                nombre: { type: string, maxLength: 150 }
      responses:
        "200": { description: Sucursal actualizada. }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [ops]
      operationId: deleteStore
      summary: "Borrado lógico de sucursal (ops.config.manage) -> 204; luego GET -> 404. Sin DELETE FROM."
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "204": { description: Sucursal inactivada. }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/ops/registers:
    get:
      tags: [ops]
      operationId: listRegisters
      summary: "Cajas registradoras (token). Filtro store_id -> 200 [{id, store_id, codigo, estado}]."
      parameters:
        - name: store_id
          in: query
          schema: { type: integer }
      responses:
        "200": { description: Colección de cajas. }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [ops]
      operationId: createRegister
      summary: "Crea caja (ops.config.manage). Body {store_id, codigo} -> 201 | 409 DUPLICATE_CODE."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [store_id, codigo]
              properties:
                store_id: { type: integer }
                codigo: { type: string, maxLength: 20 }
      responses:
        "201": { description: Caja creada. }
        "400": { $ref: "#/components/responses/ValidationError" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/ops/registers/{id}:
    get:
      tags: [ops]
      operationId: getRegister
      summary: "Caja por id (token) -> 200 | 404."
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200": { description: Caja. }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [ops]
      operationId: updateRegister
      summary: "Actualiza caja (ops.config.manage). Body {store_id, codigo} -> 200."
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [store_id, codigo]
              properties:
                store_id: { type: integer }
                codigo: { type: string, maxLength: 20 }
      responses:
        "200": { description: Caja actualizada. }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [ops]
      operationId: deleteRegister
      summary: "Borrado lógico de caja (ops.config.manage) -> 204."
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "204": { description: Caja inactivada. }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/ops/registers/{id}/shift:
    get:
      tags: [ops]
      operationId: getShift
      summary: "Turno actual de la caja (token) -> 200."
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200": { description: Turno actual. }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/ops/registers/{id}/shift/open:
    post:
      tags: [ops]
      operationId: openShift
      summary: "Abre turno (ops.config.manage) -> 200 | 409 SHIFT_ALREADY_OPEN."
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200": { description: Turno abierto. }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/ops/registers/{id}/shift/close:
    post:
      tags: [ops]
      operationId: closeShift
      summary: "Cierra turno (ops.config.manage) -> 200 | 409 SHIFT_NOT_OPEN."
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200": { description: Turno cerrado. }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/ops/config:
    get:
      tags: [ops]
      operationId: listConfig
      summary: "Parámetros del sistema (token). Filtro store_id -> 200 [{config_key, config_value, value_type, store_id}]."
      parameters:
        - name: store_id
          in: query
          schema: { type: integer }
      responses:
        "200": { description: Colección de parámetros. }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/ops/config/{key}:
    get:
      tags: [ops]
      operationId: getConfig
      summary: "Parámetro por clave (token) -> 200 | 404."
      parameters: [{ $ref: "#/components/parameters/KeyPath" }]
      responses:
        "200": { description: Parámetro. }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [ops]
      operationId: upsertConfig
      summary: "Upsert de parámetro (ops.config.manage). Body {config_value<=4000, value_type texto|numero|booleano|json, store_id?} -> 200; claves store.* exigen store_id."
      parameters: [{ $ref: "#/components/parameters/KeyPath" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [config_value, value_type]
              properties:
                config_value: { type: string, maxLength: 4000 }
                value_type: { type: string, enum: [texto, numero, booleano, json] }
                store_id: { type: integer }
      responses:
        "200": { description: Parámetro guardado. }
        "400": { $ref: "#/components/responses/ValidationError" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/catalog/products:
    get:
      tags: [catalog]
      operationId: listProducts
      summary: "Productos (token). Filtros q/category_id/page/limit -> 200."
      responses:
        "200": { description: Colección de productos. }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [catalog]
      operationId: createProduct
      summary: "Crea producto (catalog.manage). Body {sku [A-Za-z0-9._-], nombre, principio_activo, presentacion, concentracion, condicion_venta libre|receta|controlado} -> 201 | 409 DUPLICATE_SKU."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sku, nombre, principio_activo, presentacion, concentracion, condicion_venta]
              properties:
                sku: { type: string, maxLength: 50 }
                nombre: { type: string, maxLength: 255 }
                principio_activo: { type: string, maxLength: 255 }
                presentacion: { type: string, maxLength: 100 }
                concentracion: { type: string, maxLength: 100 }
                condicion_venta: { type: string, enum: [libre, receta, controlado] }
      responses:
        "201": { description: Producto creado. }
        "400": { $ref: "#/components/responses/ValidationError" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/catalog/products/{id}:
    get:
      tags: [catalog]
      operationId: getProduct
      summary: "Producto por id (token) -> 200 | 404."
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200": { description: Producto. }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [catalog]
      operationId: updateProduct
      summary: "Reemplazo completo del producto (catalog.manage) -> 200."
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductBody" }
      responses:
        "200": { description: Producto actualizado. }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [catalog]
      operationId: deleteProduct
      summary: "Borrado lógico (catalog.manage) -> 204; fila persiste con estado='inactivo'."
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "204": { description: Producto inactivado. }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/catalog/products/{id}/categories:
    get:
      tags: [catalog]
      operationId: getProductCategories
      summary: "Categorías del producto (token) -> 200 {product_id, categories:[{id, nombre}]}."
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200": { description: Categorías vinculadas. }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [catalog]
      operationId: syncProductCategories
      summary: "Sincroniza categorías por reemplazo completo (catalog.manage). Body {category_ids:[int]} -> 200."
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category_ids]
              properties:
                category_ids: { type: array, items: { type: integer } }
      responses:
        "200": { description: Categorías sincronizadas. }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/catalog/prices:
    get:
      tags: [catalog]
      operationId: listPrices
      summary: "Lista de precios (token). Filtros product_id/store_id -> 200 [{id, product_id, store_id, precio, vigente_desde, vigente_hasta}]. Append-only."
      responses:
        "200": { description: Colección de precios. }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [catalog]
      operationId: createPrice
      summary: "Crea precio (catalog.manage). Body {product_id, store_id?, precio>0, vigente_desde, vigente_hasta?} -> 201 | 409 DUPLICATE_PRICE."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PriceBody" }
      responses:
        "201": { description: Precio creado. }
        "400": { $ref: "#/components/responses/ValidationError" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/catalog/prices/{id}:
    put:
      tags: [catalog]
      operationId: updatePrice
      summary: "Ajusta precio / cierra vigencia (catalog.manage). Sin DELETE: append-only -> 200."
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PriceBody" }
      responses:
        "200": { description: Precio actualizado. }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/catalog/promotions:
    get:
      tags: [catalog]
      operationId: listPromotions
      summary: "Promociones (token) -> 200 [{id, product_id, category_id, descuento_pct, desde, hasta}]. Append-only."
      responses:
        "200": { description: Colección de promociones. }
