            schema:
              type: object
              required: [store_id]
              properties: { store_id: { type: integer } }
      responses:
        "200": { description: Recepción confirmada; lote creado. }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/purchases/receptions/{id}/rechazar:
