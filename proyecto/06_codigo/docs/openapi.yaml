      operationId: listOrders
      summary: "Órdenes de compra (token). Filtros q/supplier_id/estado (borrador|emitida|recibida|cancelada) -> 200."
      responses:
        "200": { description: Colección de órdenes. }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [purchases]
      operationId: createOrder
      summary: "Crea orden en borrador (purchases.manage). Body {numero?, supplier_id, items:[{product_id, cantidad_pedida}]} -> 201 | 409 DUPLICATE_NUMERO."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [supplier_id, items]
              properties:
                numero: { type: string, maxLength: 50, description: "Opcional; autogenerado si se omite." }
                supplier_id: { type: integer }
                items:
                  type: array
                  items:
                    type: object
                    required: [product_id, cantidad_pedida]
                    properties:
                      product_id: { type: integer }
                      cantidad_pedida: { type: integer, minimum: 1 }
      responses:
        "201": { description: Orden creada (borrador). }
        "400": { $ref: "#/components/responses/ValidationError" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/purchases/orders/{id}:
    get:
      tags: [purchases]
      operationId: getOrder
      summary: "Orden con items (token) -> 200 {..orden, items:[{product_id, cantidad_pedida, cantidad_recibida}]} | 404."
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200": { description: Orden con items. }
        "404": { $ref: "#/components/responses/NotFound" }
