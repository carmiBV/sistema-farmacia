      responses:
        "200": { description: Reserva confirmada. }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/inventory/reservations/{id}/cancelar:
    post:
      tags: [inventory]
      operationId: cancelReservation
      summary: "Cancela reserva (inventory.manage) -> 200 | 409 RESERVATION_NOT_PENDING."
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200": { description: Reserva cancelada. }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/rx/prescriptions:
    get:
      tags: [rx]
      operationId: listPrescriptions
      summary: "Recetas (token). Filtros patient_id/prescriber_id -> 200 [{id, prescriber_id, prescriber_nombre, patient_id, patient_nombre, fecha, numero_referencia}]."
      responses:
        "200": { description: Colección de recetas. }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [rx]
      operationId: createPrescription
      summary: "Registra receta (rx.manage). Body {prescriber_id, patient_id, fecha Y-m-d, numero_referencia?, items:[{product_id, cantidad_prescrita}]} -> 201 {prescripcion, items}."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prescriber_id, patient_id, fecha, items]
              properties:
                prescriber_id: { type: integer }
                patient_id: { type: integer }
                fecha: { type: string, format: date }
                numero_referencia: { type: string, maxLength: 100 }
                items:
                  type: array
                  items:
                    type: object
                    required: [product_id, cantidad_prescrita]
                    properties:
                      product_id: { type: integer }
                      cantidad_prescrita: { type: integer, minimum: 1, maximum: 100000 }
      responses:
        "201": { description: Receta registrada. }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/rx/prescriptions/{id}:
    get:
      tags: [rx]
      operationId: getPrescription
      summary: "Receta con items (token) -> 200 {prescripcion, items:[{id, product_id, cantidad_prescrita, cantidad_dispensada, saldo}]} | 404."
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200": { description: Receta con items. }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/rx/prescriptions/{id}/dispensar:
    post:
      tags: [rx]
      operationId: dispensePrescription
      summary: "Dispensación con CAS de saldo (rx.manage). Body {items:[{rx_item_id, cantidad}]} -> 200 | 409 RX_SALDO_INSUFICIENTE. No descuenta stock ni kárdex (Opción A vigente)."
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items:
                    type: object
                    required: [rx_item_id, cantidad]
                    properties:
                      rx_item_id: { type: integer }
                      cantidad: { type: integer, minimum: 1 }
      responses:
        "200": { description: Dispensación registrada. }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/control/ledger:
    get:
      tags: [control]
      operationId: listLedger
      summary: "Libro Oficial de Controlados, append-only (token). Filtros store_id/product_id/tipo/ref_tipo/desde/hasta (RF-071) -> 200."
      responses:
        "200": { description: Colección de asientos. }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/control/ledger/{id}:
    get:
      tags: [control]
      operationId: getLedgerEntry
      summary: "Asiento por id (token) -> 200 | 404. Sin operaciones de escritura: libro inmutable."
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200": { description: Asiento. }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/control/balances:
    get:
      tags: [control]
      operationId: listBalances
      summary: "Saldos por sucursal/producto (token) -> 200 [{store_id, product_id, saldo, saldo_calculado, conciliado}]."
      responses:
        "200": { description: Colección de saldos. }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/control/reconciliation:
    get:
      tags: [control]
      operationId: reconciliation
      summary: "Conciliación de saldos (token, RNF-024) -> 200 {total, conciliados, desbalanceados, diferencias}."
      responses:
        "200": { description: Resultado de la conciliación. }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/control/adjustments:
    post:
      tags: [control]
      operationId: createAdjustment
      summary: "Ajuste con DOBLE AUTORIZACIÓN (control.manage, RF-046). Body {store_id, product_id, lot_id, cantidad, direccion baja|incremento, motivo, autorizador_id != proponente} -> 201 | 409 DOUBLE_AUTH_REQUIRED / STOCK_NOT_ENOUGH / PRODUCT_NOT_CONTROLLED."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [store_id, product_id, lot_id, cantidad, direccion, motivo, autorizador_id]
              properties:
                store_id: { type: integer }
                product_id: { type: integer }
                lot_id: { type: integer }
                cantidad: { type: integer, minimum: 1 }
                direccion: { type: string, enum: [baja, incremento] }
                motivo: { type: string, maxLength: 500 }
                autorizador_id: { type: integer }
      responses:
        "201": { description: Ajuste registrado (movimiento + asiento del libro). }
        "400": { $ref: "#/components/responses/ValidationError" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/sales/orders:
    get:
      tags: [sales]
      operationId: listSales
      summary: "Ventas POS (token). Filtros store_id/estado (pendiente|pagada|anulada|devuelta) -> 200."
      responses:
        "200": { description: Colección de ventas. }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [sales]
      operationId: createSale
      summary: "Venta en caja (sales.manage, RN-01/09): descuenta stock por lote y escribe kárdex salida. Body {store_id, register_id, paciente_id?, items:[{lot_id, cantidad, precio_unitario}], idempotency_key?} -> 201 | 200 reused | 409 STOCK_NOT_ENOUGH / LOT_NOT_RELEASED / LOT_EXPIRED / REGISTER_NOT_IN_STORE."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [store_id, register_id, items]
              properties:
                store_id: { type: integer }
                register_id: { type: integer }
                paciente_id: { type: integer }
                idempotency_key: { type: string, maxLength: 255 }
                items:
                  type: array
                  items:
                    type: object
                    required: [lot_id, cantidad]
                    properties:
                      lot_id: { type: integer }
                      cantidad: { type: integer, minimum: 1 }
                      precio_unitario: { type: number, minimum: 0 }
      responses:
        "201": { description: Venta registrada. }
        "200": { description: Venta reutilizada por idempotency_key. }
        "400": { $ref: "#/components/responses/ValidationError" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/sales/orders/{id}:
    get:
      tags: [sales]
      operationId: getSale
      summary: "Comprobante de venta (token) -> 200 {orden, items, pagos} | 404."
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200": { description: Venta con items y pagos (fuente del comprobante). }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/sales/orders/{id}/payments:
    post:
      tags: [sales]
      operationId: createPayment
      summary: "Pago (sales.manage, RF-050). Body {medio efectivo|tarjeta|otros, monto, idempotency_key?} -> 200 | 409 PAYMENT_EXCEEDS_DUE / ORDER_NOT_PENDING."
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [medio, monto]
              properties:
                medio: { type: string, enum: [efectivo, tarjeta, otros] }
                monto: { type: number, exclusiveMinimum: 0 }
                idempotency_key: { type: string, maxLength: 255 }
      responses:
        "200": { description: Pago registrado; la suma puede transicionar la orden a pagada. }
        "400": { $ref: "#/components/responses/ValidationError" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/sales/orders/{id}/anular:
    post:
      tags: [sales]
      operationId: voidSale
      summary: "Anulación (sales.manage, RN-10): repone stock con movimientos compensatorios -> 200 | 409 ORDER_NOT_CANCELLABLE."
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200": { description: Venta anulada; stock repuesto. }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/sales/returns:
    get:
      tags: [sales]
      operationId: listReturns
      summary: "Devoluciones (token). Filtro order_id/store_id -> 200."
      responses:
        "200": { description: Colección de devoluciones. }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [sales]
      operationId: createReturn
      summary: "Devolución (sales.manage, RF-060). Body {order_id, motivo, items:[{order_item_id, cantidad, condicion vendible|no_vendible}]} -> 201 | 409 RETURN_EXCEEDS_SOLD. vendible reingresa stock; no_vendible da de baja."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_id, motivo, items]
              properties:
                order_id: { type: integer }
                motivo: { type: string, maxLength: 500 }
                items:
                  type: array
                  items:
                    type: object
                    required: [order_item_id, cantidad, condicion]
                    properties:
                      order_item_id: { type: integer }
                      cantidad: { type: integer, minimum: 1 }
                      condicion: { type: string, enum: [vendible, no_vendible] }
      responses:
        "201": { description: Devolución registrada. }
        "400": { $ref: "#/components/responses/ValidationError" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/sales/returns/{id}:
    get:
      tags: [sales]
      operationId: getReturn
      summary: "Devolución con items (token) -> 200 | 404."
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200": { description: Devolución con items. }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/audit/operations:
    get:
      tags: [audit]
      operationId: listAuditOperations
      summary: "Logs de operaciones sensibles (audit.read, RF-090). Filtros accion/entidad/desde/hasta -> 200. Valores redactados (RNF-050)."
      responses:
        "200": { description: Colección de operaciones. }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/audit/operations/{id}:
    get:
      tags: [audit]
      operationId: getAuditOperation
      summary: "Operación auditada (audit.read) -> 200 | 404. Sin escritura: logs inmutables."
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200": { description: Operación auditada. }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/audit/pii:
    get:
      tags: [audit]
      operationId: listPiiAccess
      summary: "Accesos a datos personales (audit.read, RF-091/RN-13). Filtro accion -> 200."
      responses:
        "200": { description: Colección de accesos PII. }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/audit/pii/{id}:
    get:
      tags: [audit]
      operationId: getPiiAccess
      summary: "Acceso PII por id (audit.read) -> 200 | 404."
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200": { description: Acceso PII. }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/audit/events:
    get:
      tags: [audit]
      operationId: listEvents
      summary: "Eventos salientes del outbox (audit.read, decisión 16). Filtro estado (pendiente|procesado|fallido) -> 200."
      responses:
        "200": { description: Colección de eventos. }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/audit/events/{id}:
    get:
      tags: [audit]
      operationId: getEvent
      summary: "Evento con payload (audit.read) -> 200 | 404."
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200": { description: Evento. }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/audit/events/{id}/procesar:
    post:
      tags: [audit]
      operationId: processEvent
      summary: "Marca evento como procesado (audit.manage) -> 200 | 409 EVENT_NOT_PENDING."
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200": { description: Evento procesado. }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/audit/events/{id}/fallar:
    post:
      tags: [audit]
      operationId: failEvent
      summary: "Marca evento como fallido (audit.manage) -> 200 | 409 EVENT_NOT_PENDING."
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200": { description: Evento fallido. }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/audit/events/{id}/reintentar:
    post:
      tags: [audit]
      operationId: retryEvent
      summary: "Reintenta evento fallido (audit.manage) -> 200 | 409 EVENT_NOT_FAILED."
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200": { description: Evento devuelto a pendiente. }
        "409": { $ref: "#/components/responses/Conflict" }
components:
  parameters:
    CategoryId:
      name: id
      in: path
      required: true
      description: Identificador numérico de la categoría.
      schema: { type: integer, minimum: 1 }
    IdPath:
      name: id
      in: path
      required: true
      description: Identificador numérico del recurso.
      schema: { type: integer, minimum: 1 }
    KeyPath:
      name: key
      in: path
      required: true
      description: Clave del parámetro del sistema.
      schema: { type: string, maxLength: 100 }
  schemas:
    Category:
      type: object
      required: [id, nombre, parent_id]
      properties:
        id: { type: integer, description: PK autoincremental, readOnly. }
        nombre:
          type: string
          minLength: 1
          maxLength: 150
        parent_id:
          type: [integer, "null"]
          description: Categoría padre; `null` en categorías raíz.
    CategoryCreate:
      type: object
      required: [nombre]
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 150
        parent_id:
          type: [integer, "null"]
          minimum: 1
          description: Categoría padre opcional; debe existir.
    CategoryUpdate:
      type: object
      required: [nombre]
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 150
        parent_id:
          type: [integer, "null"]
          minimum: 1
    Meta:
      type: object
      required: [total, page, limit]
      properties:
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        limit: { type: integer, minimum: 1, maximum: 100 }
    ErrorEnvelope:
      type: object
      required: [success, error]
      properties:
        success: { type: boolean, const: false }
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - VALIDATION_ERROR
                - NOT_FOUND
                - DUPLICATE_NAME
                - DUPLICATE_IDENTIFICATION
                - DUPLICATE_SKU
                - DUPLICATE_CODE
                - DUPLICATE_PRICE
                - DUPLICATE_NUMERO
                - DUPLICATE_LOT
                - HIERARCHY_CYCLE
                - INVALID_CREDENTIALS
                - ACCOUNT_DISABLED
                - RATE_LIMITED
                - UNAUTHENTICATED
                - FORBIDDEN
                - PRODUCT_NOT_FOUND
                - PRODUCT_NOT_CONTROLLED
                - USER_NOT_FOUND
                - PRESCRIPTION_NOT_FOUND
                - RX_SALDO_INSUFICIENTE
                - DOUBLE_AUTH_REQUIRED
                - LOT_NOT_FOUND
                - LOT_NOT_FOR_PRODUCT
                - LOT_NOT_QUARANTINE
                - LOT_NOT_RELEASED
                - LOT_EXPIRED
                - STOCK_NOT_ENOUGH
                - TRANSFER_SAME_STORE
                - TRANSFER_NOT_PENDING
                - ITEM_NOT_IN_ORDER
                - EXCEEDS_PENDING
                - ORDER_NOT_ISSUED
                - ORDER_NOT_PENDING
                - ORDER_NOT_DRAFT
                - ORDER_NOT_CANCELLABLE
                - ORDER_HAS_RECEPTIONS
                - RECEPTION_NOT_PENDING
                - PAYMENT_EXCEEDS_DUE
                - RETURN_EXCEEDS_SOLD
                - INCIDENT_NOT_OPEN
                - ALERT_NOT_OPEN
                - RESERVATION_NOT_PENDING
                - SHIFT_ALREADY_OPEN
                - SHIFT_NOT_OPEN
                - EVENT_NOT_FOUND
                - EVENT_NOT_PENDING
                - EVENT_NOT_FAILED
                - DATABASE_ERROR
                - INTERNAL_ERROR
    ProductBody:
      type: object
      required: [sku, nombre, principio_activo, presentacion, concentracion, condicion_venta]
      properties:
        sku: { type: string, maxLength: 50 }
        nombre: { type: string, maxLength: 255 }
        principio_activo: { type: string, maxLength: 255 }
        presentacion: { type: string, maxLength: 100 }
        concentracion: { type: string, maxLength: 100 }
        condicion_venta: { type: string, enum: [libre, receta, controlado] }
    PriceBody:
      type: object
      required: [product_id, precio, vigente_desde]
      properties:
        product_id: { type: integer }
        store_id: { type: integer, description: "Opcional; sin store_id es precio global." }
        precio: { type: number, exclusiveMinimum: 0 }
        vigente_desde: { type: string, format: date }
        vigente_hasta: { type: string, format: date, description: "Opcional; cierra la vigencia." }
    PromotionBody:
      type: object
      required: [descuento_pct, desde, hasta]
      properties:
        product_id: { type: integer, description: "Obligatorio si no hay category_id." }
        category_id: { type: integer, description: "Obligatorio si no hay product_id." }
        descuento_pct: { type: number, exclusiveMinimum: 0, maximum: 100 }
        desde: { type: string, format: date }
        hasta: { type: string, format: date }
    SupplierBody:
      type: object
      required: [identificacion, nombre]
      properties:
        identificacion: { type: string, maxLength: 30 }
        nombre: { type: string, maxLength: 200 }
        contacto: { type: string, maxLength: 255 }
    PatientBody:
      type: object
      required: [identificacion, nombre, fecha_nacimiento]
      properties:
        identificacion: { type: string, maxLength: 30 }
        nombre: { type: string, maxLength: 200 }
        fecha_nacimiento: { type: string, format: date }
        contacto: { type: string, maxLength: 255 }
    PrescriberBody:
      type: object
      required: [identificacion, nombre]
      properties:
        identificacion: { type: string, maxLength: 30 }
        nombre: { type: string, maxLength: 200 }
        especialidad: { type: string, maxLength: 150 }
  responses:
    ValidationError:
      description: Entrada inválida (400).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            success: false
            error:
              code: VALIDATION_ERROR
              message: "El campo 'nombre' es obligatorio."
    NotFound:
      description: Categoría inexistente (404).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            success: false
            error:
              code: NOT_FOUND
              message: "Categoría no encontrada."
    DatabaseError:
      description: Error interno de base de datos (500), sin detalle sensible.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            success: false
            error:
              code: DATABASE_ERROR
              message: "Error interno."
    Unauthorized:
      description: Sin token o token inválido/revocado (401 UNAUTHENTICATED).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Forbidden:
      description: Token válido sin el permiso requerido (403 FORBIDDEN).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Conflict:
      description: Conflicto de negocio (409/400 según operación; ver summary por código DUPLICATE_*, ORDER_*, LOT_*, STOCK_NOT_ENOUGH, etc.).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT HS256 emitido por POST /api/v1/auth/login.
